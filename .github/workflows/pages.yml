name: Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - add-act
          - bind-hotkey
          - cube
          - cube-async
          - demo-async
          - exclude-commands
          - opt-in
          - solicit-user
          - tab-completion
          - tab-completion-async
          - tapes
          - two-commands
          - two-commands-async
          - universal-arg
          - universal-arg-async
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-pages
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build WASM example
        working-directory: web
        env:
          NO_COLOR: "true"
        run: >
          trunk build
          --config Trunk.toml
          --release
          --dist "built/${{ matrix.example }}"
          --public-url ./
          "${{ matrix.example }}/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}
          path: web/built/${{ matrix.example }}

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: web/dist
      - name: Add example index
        run: cp web/index.html web/dist/index.html
      - name: Check Pages artifact
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          test -f web/dist/opt-in/index.html
          test -f web/dist/demo-async/index.html
          test -f web/dist/tapes/index.html
          ls web/dist/opt-in/*.wasm web/dist/demo-async/*.wasm web/dist/tapes/*.wasm >/dev/null
          if grep -RE "href=/|from '/|module_or_path: '/" web/dist --include='*.html' --include='*.js'; then
            echo "absolute / asset URLs would break under the GitHub Pages prefix" >&2
            exit 1
          fi
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

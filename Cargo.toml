[workspace]
members = ["web/app"]
default-members = ["."]
resolver = "2"

[package]
name = "bevy_minibuffer"
description = "A gamedev console inspired by classic Unix text editors"
version = "0.8.0"
edition = "2021"
authors = ["Shane Celis <shane.celis@gmail.com>"]
keywords = [
    "bevy",
    "gamedev",
    "console",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shanecelis/bevy_minibuffer"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [ "bevy_text", "bevy_ui", "bevy_ui_widgets", "bevy_input_focus", "default_font", "bevy_window", "bevy_state", "bevy_log", "std", "async_executor" ] }
bitflags = "2.9"
trie-rs = "0.4.2"
bevy-input-sequence = "0.12"
keyseq = { version = "0.10.0", features = [ "bevy" ]}
bevy_asky = { version = "0.7", default-features = false, features = [ "color" ] }
futures = { version = "0.3.30", optional = true }
tabular = "0.2.0"
thiserror = "2.0"
bevy_defer = { version = "0.19", optional = true }
accesskit = "0.24.1"
copypasta = { version = "0.10.1", optional = true }
variadics_please = "1.1.0"
foldhash = "0.2"
bevy_channel_message = { version = "0.4", optional = true }

# Enable getrandom's JS backend for wasm32-unknown-unknown. Both 0.3 and 0.4
# appear in the Bevy 0.20 tree and each needs the feature independently.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[features]
async = [ "dep:bevy_defer", "dep:futures", "bevy_asky/async", "dep:bevy_channel_message" ]
fun = [ "bevy/bevy_audio" ]
dev-capture = []
clipboard = ["dep:copypasta"]
x11 = ["bevy/x11"]

[dev-dependencies]
bevy = "0.20.0"
bevy-inspector-egui = "0.37"
bevy_egui = "0.43"
bevy_framepace = "0.22"
bevy_image_export = "0.17"
rand = "0.9"
version-sync = "0.9.5"

[[example]]
name = "demo-async"
path = "examples/async/demo.rs"
required-features = [ "async" ]

[[example]]
name = "cube-async"
path = "examples/async/cube.rs"
required-features = [ "async" ]

[[example]]
name = "two-commands-async"
path = "examples/async/two-commands.rs"
required-features = [ "async" ]

[[example]]
name = "universal-arg-async"
path = "examples/async/universal-arg.rs"
required-features = [ "async" ]

[[example]]
name = "tab-completion-async"
path = "examples/async/tab-completion.rs"
required-features = [ "async" ]

[package.metadata.docs.rs]
features = ["x11", "async", "fun"]

# Size-first profile for GitHub Pages WASM example builds via trunk.
# Do not strip here: rustc strip removes wasm-bindgen's custom sections.
# Trunk runs wasm-opt -Oz after bindgen (`data-wasm-opt="z"`).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
# "symbols" drops the wasm name section; "debuginfo" leaves it (~40 MB).
strip = "symbols"


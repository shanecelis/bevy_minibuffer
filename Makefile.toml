# Local GitHub Pages publish for the WASM examples.
# `cargo make pages` builds every example, assembles web/dist, and
# force-pushes one commit to the gh-pages branch.

[env]
PAGES_EXAMPLES = "opt-in add-act bind-hotkey cube exclude-commands solicit-user tab-completion two-commands universal-arg tapes demo-async cube-async two-commands-async universal-arg-async tab-completion-async"

[tasks.pages-build-one]
description = "Build one WASM example. Pass the name, or set EXAMPLE."
category = "Pages"
workspace = false
cwd = "web"
script = '''
set -eu
example=""
if [ "$#" -gt 0 ]; then
  example="$1"
fi
if [ -z "$example" ]; then
  example="${EXAMPLE-}"
fi
if [ -z "$example" ]; then
  echo "pass an example name: cargo make pages-build-one opt-in" >&2
  exit 1
fi
case "$example" in
  *" "*)
    echo "build one example at a time" >&2
    exit 1
    ;;
esac
trunk build \
  --config Trunk.toml \
  --release \
  --dist "built/${example}" \
  --public-url ./ \
  "${example}/index.html"
'''

[tasks.pages-build-opt-in]
private = true
workspace = false
env = { EXAMPLE = "opt-in" }
run_task = { name = "pages-build-one", fork = true }


[tasks.pages-doc]
description = "Build rustdoc for the pages site root."
category = "Pages"
workspace = false
command = "cargo"
args = ["doc", "--no-deps", "-p", "bevy_minibuffer", "--features", "async,fun"]

[tasks.pages-dist]
description = "Assemble web/dist: rustdoc at the root, WASM examples under examples/."
category = "Pages"
workspace = false
cwd = "web"
dependencies = ["pages-doc"]
script = '''
set -eu
root=$(git rev-parse --show-toplevel)
cd "$root/web"

if [ -n "$CARGO_TARGET_DIR" ]; then
  doc="$CARGO_TARGET_DIR/doc"
else
  doc="$root/target/doc"
fi
if [ ! -f "$doc/bevy_minibuffer/index.html" ]; then
  echo "missing rustdoc; run cargo make pages-doc" >&2
  exit 1
fi

rm -rf dist
mkdir -p dist
cp -a "$doc/." dist/
# Crate pages live in bevy_minibuffer/ so their links to ../static.files work.
# The site root sends people there.
cat > dist/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=bevy_minibuffer/" />
    <link rel="canonical" href="bevy_minibuffer/" />
    <title>bevy_minibuffer</title>
    <script>location.replace("bevy_minibuffer/")</script>
  </head>
  <body>
    <p><a href="bevy_minibuffer/">bevy_minibuffer API docs</a></p>
  </body>
</html>
EOF
mkdir -p dist/examples
for example in $PAGES_EXAMPLES; do
  if [ ! -d "built/$example" ]; then
    echo "missing web/built/$example" >&2
    exit 1
  fi
  mkdir -p "dist/examples/$example"
  cp -R "built/$example/." "dist/examples/$example/"
  rm -rf "dist/examples/$example/.stage"
done
cp examples/index.html dist/examples/index.html
: > dist/.nojekyll

test -f dist/index.html
test -f dist/bevy_minibuffer/index.html
test -f dist/examples/index.html
test -f dist/examples/opt-in/index.html
test -f dist/examples/demo-async/index.html
test -f dist/examples/tapes/index.html
for example in $PAGES_EXAMPLES; do
  test -f "dist/examples/$example/index.html"
  grep -q 'href="../../">bevy_minibuffer' "dist/examples/$example/index.html"
  grep -q 'href="../">examples' "dist/examples/$example/index.html"
  found=0
  for wasm in "dist/examples/$example"/*.wasm; do
    if [ -f "$wasm" ]; then
      found=1
      break
    fi
  done
  if [ "$found" -ne 1 ]; then
    echo "missing wasm for $example" >&2
    exit 1
  fi
done
if grep -RE "href=/|from '/|module_or_path: '/" dist --include='*.html' --include='*.js'; then
  echo "absolute / asset URLs would break under the GitHub Pages prefix" >&2
  exit 1
fi

if [ "$#" -gt 0 ]; then
  cd "$root"
  for task in "$@"; do
    cargo make --no-workspace "$task"
  done
fi
'''

[tasks.pages-push]
description = "Force-push web/dist as a single commit on gh-pages."
category = "Pages"
workspace = false
script = '''
set -eu
branch=gh-pages
case "$branch" in
  main|master)
    echo "refusing to publish to $branch" >&2
    exit 1
    ;;
esac

root=$(git rev-parse --show-toplevel)
dist="$root/web/dist"
if [ ! -f "$dist/index.html" ]; then
  echo "web/dist is missing; run cargo make pages-dist" >&2
  exit 1
fi
if [ ! -f "$dist/.nojekyll" ]; then
  echo "web/dist/.nojekyll is missing; run cargo make pages-dist" >&2
  exit 1
fi

origin=$(git -C "$root" remote get-url origin)
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT

git -C "$tmp" init -b "$branch"
cp -R "$dist/." "$tmp/"
test -f "$tmp/.nojekyll"
test -f "$tmp/index.html"
git -C "$tmp" add -A
git -C "$tmp" commit -m "Publish WASM examples."
git -C "$tmp" remote add origin "$origin"
git -C "$tmp" push --force origin "HEAD:$branch"

echo "https://www.shanecelis.com/bevy_minibuffer/"
'''

[tasks.pages]
description = "Build the WASM examples and publish them to gh-pages."
category = "Pages"
workspace = false
dependencies = ["pages-build", "pages-dist", "pages-push"]

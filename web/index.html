<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bevy_minibuffer</title>
    <!-- Relative links stay under /bevy_minibuffer/ when this page is opened
         without a trailing slash. -->
    <base id="site-root" href="./" />
    <script>
      (function () {
        var pages = "/bevy_minibuffer/";
        var path = location.pathname;
        var at = path.indexOf(pages);
        var root = at === -1 ? "/" : path.slice(0, at + pages.length);
        document.getElementById("site-root").href = root;
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        background: #111;
        color: #ddd;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 64rem; margin: 2rem auto; padding: 0 1rem 3rem; }
      a { color: #8ecae6; }
      h1 { font-weight: 600; }
      nav {
        display: flex;
        gap: 1.25rem;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>bevy_minibuffer</h1>
      <nav>
        <a href="https://github.com/shanecelis/bevy_minibuffer">github</a>
        <a href="https://crates.io/crates/bevy_minibuffer">crate</a>
        <a href="examples/">examples</a>
      </nav>
    </main>
  </body>
</html>

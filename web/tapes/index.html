<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bevy_minibuffer · tapes</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ddd;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        padding: 0.45rem 0.8rem;
        font-size: 0.9rem;
      }
      header a { color: #8ecae6; text-decoration: none; }
      header a:hover { text-decoration: underline; }
      .sep { opacity: 0.45; }
      .name { position: relative; cursor: help; }
      .tip {
        display: none;
        position: absolute;
        left: 0;
        top: calc(100% + 0.35rem);
        z-index: 2;
        white-space: nowrap;
        background: #1b1b1b;
        color: #ddd;
        border-radius: 4px;
        padding: 0.3rem 0.5rem;
        font-size: 0.8rem;
      }
      .name:hover .tip { display: block; }
      /* The stage is the canvas parent, so Bevy's 100% size stays under the bar. */
      .stage { position: relative; flex: 1 1 auto; min-height: 0; }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        background: #000;
      }
      .loading {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        pointer-events: none;
      }
    </style>
    <link
      data-trunk
      rel="rust"
      href="../app/Cargo.toml"
      data-bin="tapes"
      data-cargo-features="fun"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory-opt --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext"
      data-cargo-profile-release="wasm-release"
    />
  </head>
  <body>
    <header>
      <a href="../">examples</a>
      <span class="sep">/</span>
      <span class="name">tapes<span class="tip">Click canvas then type.</span></span>
    </header>
    <div class="stage">
      <canvas id="bevy" tabindex="0" autofocus></canvas>
      <p class="loading" id="loading">Loading…</p>
    </div>
    <script>
      addEventListener("TrunkApplicationStarted", function () {
        var el = document.getElementById("loading");
        if (el) el.remove();
      });
    </script>
  </body>
</html>
